<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in — TiffinBook</title><link rel="stylesheet" href="/css/styles.css"></head><body><nav class="nav"><a class="brand" href="/"><span class="brand-mark">🍱</span>TiffinBook</a><div class="nav-actions"><a class="btn secondary" href="/register.html">Create account</a></div></nav><main class="auth-shell"><section class="auth-card reveal"><span class="eyebrow">Welcome back</span><h1>Log in to your kitchen.</h1><p class="muted">See today's delivery queue, customer health and live billing.</p><form id="loginForm"><div class="form-field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required placeholder="owner@example.com"></div><div class="form-field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required placeholder="••••••••"></div><button class="btn" type="submit" style="width:100%;margin-top:8px">Log in →</button><p class="error hidden" id="err"></p></form><p class="muted" style="font-size:.85rem;margin-top:20px">New here? <a href="/register.html" style="color:var(--accent-dark);font-weight:700">Create an owner account</a></p></section></main><script src="/js/app.js"></script><script src="/js/login.js"></script></body></html>
