<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account — TiffinBook</title><link rel="stylesheet" href="/css/styles.css"></head><body><nav class="nav"><a class="brand" href="/"><span class="brand-mark">🍱</span>TiffinBook</a><div class="nav-actions"><a class="btn secondary" href="/login.html">Log in</a></div></nav><main class="auth-shell"><section class="auth-card reveal"><span class="eyebrow">Start in minutes</span><h1>Build your tiffin workspace.</h1><p class="muted">Your data stays persisted in the app's SQLite database and is isolated by owner.</p><form id="registerForm"><div class="form-field"><label for="email">Owner email</label><input id="email" type="email" autocomplete="email" required placeholder="owner@example.com"></div><div class="form-field"><label for="password">Password · minimum 6 characters</label><input id="password" type="password" minlength="6" autocomplete="new-password" required placeholder="Create a strong password"></div><button class="btn" type="submit" style="width:100%;margin-top:8px">Create workspace →</button><p class="error hidden" id="err"></p></form><p class="muted" style="font-size:.85rem;margin-top:20px">Already have an account? <a href="/login.html" style="color:var(--accent-dark);font-weight:700">Log in</a></p></section></main><script src="/js/app.js"></script><script src="/js/register.js"></script></body></html>
